plugins {
    id "com.android.application"
    //id "kotlin-android"
    id "org.jetbrains.kotlin.android"
    // Flutter Gradle 플러그인은 반드시 Android 및 Kotlin 플러그인 뒤에 와야 합니다.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // 📍 유료 출시용 패키지명 설정
    namespace "com.obj.sire"

    // 📍 구형 플러그인(package_info_plus 등) 에러 방지를 위해 숫자로 명시
    compileSdk 35
    buildToolsVersion "35.0.0"

    //ndkVersion = flutter.ndkVersion
    ndkVersion = "28.1.13356709"

    compileOptions {
        // SDK 35 및 Gradle 8 대응을 위해 Java 17 사용 권장
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // 최신 라이브러리(bcprov 등)와의 호환성을 위해 17로 설정
        jvmTarget = "17"
    }

    defaultConfig {
        // 📍 실제 구글 플레이 스토어에 등록될 고유 ID (중복 불가)
        applicationId "com.obj.sire"

        // 📍 최신 보안 패키지 요구사항에 맞춘 최소/대상 SDK 설정
        minSdkVersion 24
        targetSdkVersion 35

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // ...
//        externalNativeBuild {
//            cmake {
//                // 네이티브 라이브러리 빌드 시 16KB 페이지 크기 정렬 강제
//                cppFlags "-Wl,-z,max-page-size=16384"
//            }
//        }
        // 또는 ndk 블록에 추가 (사용 중인 환경에 따라 선택)
        ndk {
            ldLibs "log"
            // 일부 환경에서는 아래 인자가 필요할 수 있습니다.
            // arguments "-DANDROID_STL=c++_shared"
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 출시용 앱의 경우 향후 별도의 signingConfig 설정이 필요합니다.
            // signingConfig = signingConfigs.debug
            signingConfig signingConfigs.release
            // 유료 앱의 코드 보안을 위해 난독화(minify)를 활성화하는 것이 좋습니다.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        jniLibs {
            // 네이티브 라이브러리를 압축하지 않고 저장하여
            // 시스템이 어떤 페이지 크기(4KB 또는 16KB)에서도 직접 읽을 수 있게 합니다.
            useLegacyPackaging = true
        }
    }
}

